version: 2.1

parameters:
  run_main_post_pr114_arm64_r2:
    type: boolean
    default: false

jobs:
  main-post-pr114-arm64-r2:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    shell: /bin/bash -eo pipefail

    steps:
      - run:
          name: Install strict native toolchain
          command: |
            set -euo pipefail

            sudo env \
              DEBIAN_FRONTEND=noninteractive \
              NEEDRESTART_MODE=a \
              apt-get update

            sudo env \
              DEBIAN_FRONTEND=noninteractive \
              NEEDRESTART_MODE=a \
              apt-get install -y --no-install-recommends \
                git \
                gcc \
                clang \
                make \
                file \
                util-linux \
                coreutils \
                grep \
                sed \
                findutils \
                gawk \
                tar

      - run:
          name: Verify exact merged main after PR114 on native ARM64
          command: |
            set -euo pipefail

            repository='https://github.com/Deadbytes101/DBLYATEM.git'
            expected_branch='deadbyte/main-post-pr114-arm64-r2'
            expected_main='07aff983f86a34b8c26e1ce5f9bd5de289441485'
            expected_feature='136fce8e903684dc602ef2453dc85c65b06ede9c'
            expected_config="${CIRCLE_SHA1}"
            expected_challenge='f7bb81baf14bea4aae06df7acdb7757b8a381b824d77a84da1002c7b3037589f'

            checkout='/tmp/dblyatem-main-post-pr114-r2-checkout'
            output='/tmp/dblyatem-main-post-pr114-r2-output'
            artifacts='/tmp/dblyatem-main-post-pr114-r2-artifacts'
            archive="$artifacts/main-post-pr114-arm64-r2.tar.gz"

            rm -rf "$checkout" "$output" "$artifacts"
            mkdir -p "$checkout" "$output" "$artifacts" "$output/source"

            [ "${CIRCLE_BRANCH:-}" = "$expected_branch" ] || {
              printf 'BRANCH MISMATCH expected=%s actual=%s\n' \
                "$expected_branch" "${CIRCLE_BRANCH:-missing}" >&2
              exit 1
            }

            machine=$(uname -m)
            case "$machine" in
              aarch64|arm64) ;;
              *) printf 'HOST ARCH REJECTED: %s\n' "$machine" >&2; exit 1 ;;
            esac

            page_size=$(getconf PAGESIZE)
            [ "$page_size" = '4096' ] || {
              printf 'PAGE SIZE REJECTED: %s\n' "$page_size" >&2
              exit 1
            }

            shell_identity=$(file -L /bin/sh)
            printf '%s\n' "$shell_identity" |
              grep -Eiq 'aarch64|ARM aarch64' || {
                printf 'NON-AARCH64 USERSPACE REJECTED: %s\n' "$shell_identity" >&2
                exit 1
              }

            virtualization=$(systemd-detect-virt 2>/dev/null || true)
            case "$virtualization" in
              qemu|bochs|uml)
                printf 'EMULATED HOST REJECTED: %s\n' "$virtualization" >&2
                exit 1
                ;;
            esac

            git init "$checkout"
            git -C "$checkout" remote add origin "$repository"
            git -C "$checkout" fetch --depth=2 origin "$expected_main"
            git -C "$checkout" checkout --detach FETCH_HEAD

            observed_main=$(git -C "$checkout" rev-parse HEAD)
            [ "$observed_main" = "$expected_main" ] || {
              printf 'MAIN HEAD MISMATCH expected=%s actual=%s\n' \
                "$expected_main" "$observed_main" >&2
              exit 1
            }

            git -C "$checkout" cat-file -e "$expected_feature^{commit}"
            git -C "$checkout" merge-base --is-ancestor \
              "$expected_feature" "$expected_main"

            parent_count=$(
              git -C "$checkout" cat-file -p "$expected_main" |
                grep -Fxc "parent $expected_feature" || true
            )
            [ "$parent_count" -eq 1 ] || {
              printf 'FEATURE DIRECT PARENT MISMATCH count=%s\n' \
                "$parent_count" >&2
              exit 1
            }

            tracked_dirty=$(git -C "$checkout" status --porcelain --untracked-files=no)
            [ -z "$tracked_dirty" ] || {
              printf '%s\n' 'FRESH CHECKOUT TRACKED DIRTY' >&2
              exit 1
            }

            benchmark_core="$checkout/src/arm64_translation_benchmark.c"
            runner_source="$checkout/tools/arm64-translation-reuse-benchmark.c"
            benchmark_verify="$checkout/tools/verify-arm64-translation-benchmark.sh"
            flag_verify="$checkout/tools/verify-arm64-translation-benchmark-flags.sh"

            grep -Fq 'operation->hit > 1u' "$benchmark_core"
            grep -Fq 'operation->full > 1u' "$benchmark_core"
            grep -Fq 'O_WRONLY | O_CREAT | O_EXCL' "$runner_source"
            grep -Fq '(void)remove(argv[1]);' "$runner_source"
            grep -Fq 'validation-build-v1' "$benchmark_verify"
            grep -Fq 'UINT32_MAX' "$checkout/tests/arm64_translation_benchmark_flag_validation_test.c"
            grep -Fq 'ARM64 TRANSLATION BENCHMARK FLAG VERIFY: PASS' "$flag_verify"

            {
              printf 'BINARY_OUTCOME_FLAGS=BOUND\n'
              printf 'WRAPAROUND_REGRESSION=PRESENT\n'
              printf 'OUTPUT_PAIR_FAIL_CLOSED=BOUND\n'
              printf 'VALIDATION_BUILD_TOKEN=NON_CLAIMING\n'
              printf 'PUBLISHED_BLOCK_EXECUTION=NO\n'
              printf 'WINLATOR_COMPARISON=NOT_RUN\n'
            } > "$output/source-contract.txt"

            set +e
            (
              cd "$checkout"
              /bin/sh tools/verify-all.sh
            ) > "$output/verify-all.stdout.log" 2>&1
            verify_status=$?
            set -e

            if [ -d "$checkout/build/verify-all" ]; then
              cp -R "$checkout/build/verify-all" "$output/verify-all"
            fi

            {
              printf 'DBLYATEM_MAIN_POST_PR114_ARM64_R2_HOST\n'
              printf 'MAIN_HEAD=%s\n' "$observed_main"
              printf 'MERGED_FEATURE_HEAD=%s\n' "$expected_feature"
              printf 'CONFIG_HEAD=%s\n' "$expected_config"
              printf 'EVIDENCE_CHALLENGE=%s\n' "$expected_challenge"
              printf 'MACHINE=%s\n' "$machine"
              printf 'RUNTIME_PAGE_SIZE=%s\n' "$page_size"
              printf 'VIRTUALIZATION=%s\n' "${virtualization:-none}"
              printf 'FRESH_CHECKOUT_DIRTY=NO\n'
              printf 'FEATURE_ANCESTOR_OF_MAIN=YES\n'
              printf 'FEATURE_DIRECT_PARENT_OF_MAIN=YES\n'
            } > "$output/host.txt"

            [ "$verify_status" -eq 0 ] || {
              cp "$output/verify-all.stdout.log" \
                "$artifacts/verify-all.failed.log"
              if [ -d "$output/verify-all" ]; then
                cp -R "$output/verify-all" \
                  "$artifacts/verify-all-failed"
              fi
              printf 'VERIFY_ALL_EXIT=%s\n' "$verify_status" >&2
              exit "$verify_status"
            }

            manifest="$output/verify-all/manifest.txt"
            step18="$output/verify-all/logs/18_verify-linux-arm64-wx-provider.log"
            step19="$output/verify-all/logs/19_verify-arm64-block-cache.log"
            step20="$output/verify-all/logs/20_verify-arm64-translation-reuse.log"
            step21="$output/verify-all/logs/21_verify-arm64-translation-benchmark.log"
            step22="$output/verify-all/logs/22_verify-arm64-translation-benchmark-flags.log"

            for required in \
              "$manifest" \
              "$step18" \
              "$step19" \
              "$step20" \
              "$step21" \
              "$step22"
            do
              [ -f "$required" ] || {
                printf 'REQUIRED EVIDENCE FILE MISSING: %s\n' "$required" >&2
                exit 1
              }
            done

            exact_line()
            {
              file_path=$1
              expected=$2
              actual=$(grep -Fxc "$expected" "$file_path" || true)
              [ "$actual" -eq 1 ] || {
                printf 'EXACT LINE MISMATCH file=%s line=[%s] expected=1 actual=%s\n' \
                  "$file_path" "$expected" "$actual" >&2
                exit 1
              }
            }

            exact_count()
            {
              file_path=$1
              expected=$2
              count=$3
              actual=$(grep -Fxc "$expected" "$file_path" || true)
              [ "$actual" -eq "$count" ] || {
                printf 'EXACT COUNT MISMATCH file=%s line=[%s] expected=%s actual=%s\n' \
                  "$file_path" "$expected" "$count" "$actual" >&2
                exit 1
              }
            }

            exact_line "$manifest" "COMMIT_SHA=$expected_main"
            exact_line "$manifest" 'STEP_18_NAME=verify-linux-arm64-wx-provider'
            exact_line "$manifest" 'STEP_18_EXIT=0'
            exact_line "$manifest" 'STEP_19_NAME=verify-arm64-block-cache'
            exact_line "$manifest" 'STEP_19_EXIT=0'
            exact_line "$manifest" 'STEP_20_NAME=verify-arm64-translation-reuse'
            exact_line "$manifest" 'STEP_20_EXIT=0'
            exact_line "$manifest" 'STEP_21_NAME=verify-arm64-translation-benchmark'
            exact_line "$manifest" 'STEP_21_EXIT=0'
            exact_line "$manifest" 'STEP_22_NAME=verify-arm64-translation-benchmark-flags'
            exact_line "$manifest" 'STEP_22_EXIT=0'
            exact_line "$manifest" 'FAILED_STEP=NONE'
            exact_line "$manifest" 'OVERALL_STATUS=PASS'

            exact_line "$output/verify-all.stdout.log" 'VERIFY ALL: PASS'
            exact_line "$step18" 'NATIVE AARCH64 EXECUTION: PASS'
            exact_line "$step19" 'ARM64 BLOCK CACHE VERIFY: PASS'
            exact_line "$step20" 'ARM64 TRANSLATION REUSE VERIFY: PASS'
            exact_count "$step21" 'ARM64 TRANSLATION BENCHMARK TEST: PASS' 3
            exact_count "$step21" 'ARM64 TRANSLATION BENCHMARK VALIDATION TEST: PASS' 3
            exact_line "$step21" 'ARM64 TRANSLATION BENCHMARK VERIFY: PASS'
            exact_line "$step21" 'ARM64 TRANSLATION BENCHMARK RECORD CONTRACT: PASS'
            exact_line "$step21" 'ARM64 TRANSLATION BENCHMARK OUTPUT PAIR: PASS'
            exact_line "$step21" 'ARM64 TRANSLATION BENCHMARK RAW CSV V1: PASS'
            exact_line "$step21" 'ARM64 TRANSLATION BENCHMARK MONOTONIC RAW RUNNER: PASS'
            exact_line "$step21" 'ARM64 TRANSLATION BENCHMARK NONEXECUTING BOUNDARY: PASS'
            exact_line "$step21" 'ARM64 TRANSLATION BENCHMARK WINLATOR CLAIM: NOT RUN'
            exact_count "$step22" 'ARM64 TRANSLATION BENCHMARK FLAG VALIDATION TEST: PASS' 3
            exact_line "$step22" 'ARM64 TRANSLATION BENCHMARK FLAG VERIFY: PASS'
            exact_line "$step22" 'ARM64 TRANSLATION BENCHMARK BINARY OUTCOME FLAGS: PASS'
            exact_line "$step22" 'ARM64 TRANSLATION BENCHMARK WRAPAROUND REGRESSION: PASS'

            common_flags='-std=c11 -O2 -Wall -Wextra -Wpedantic -Werror -Wshadow -Wstrict-prototypes -Wmissing-prototypes'
            runner="$output/arm64-translation-reuse-benchmark"

            # shellcheck disable=SC2086
            gcc -D_POSIX_C_SOURCE=200809L \
              -I"$checkout/include" \
              $common_flags \
              "$checkout/tools/arm64-translation-reuse-benchmark.c" \
              "$checkout/src/arm64_translation_benchmark.c" \
              "$checkout/src/arm64_translation_reuse_common.c" \
              "$checkout/src/arm64_translation_reuse_probe.c" \
              "$checkout/src/arm64_translation_reuse_session.c" \
              "$checkout/src/arm64_translation_reuse_lookup.c" \
              "$checkout/src/arm64_translation_reuse_publish.c" \
              "$checkout/src/arm64_translation_reuse_names.c" \
              "$checkout/src/arm64_block_cache.c" \
              -o "$runner"

            live_manifest="$output/live-manifest-v1.txt"
            live_csv="$output/live-raw-result-v1.csv"
            live_stdout="$output/live-runner.stdout.log"

            "$runner" \
              "$live_manifest" \
              "$live_csv" \
              8 \
              DBLYATEM_POST_MERGE_R2 \
              "$expected_main" \
              circleci-arm-medium \
              ubuntu-22.04 \
              linux-kernel \
              fixed-ci \
              cold-ci > "$live_stdout"

            exact_line "$live_stdout" 'ARM64 TRANSLATION BENCHMARK RUNNER: PASS'
            exact_line "$live_stdout" 'CLOCK_MONOTONIC_RAW=PASS'
            exact_line "$live_stdout" 'MANIFEST_V1=PASS'
            exact_line "$live_stdout" 'RAW_CSV_V1=PASS'
            exact_line "$live_stdout" 'SAMPLE_COUNT=32'
            exact_line "$live_stdout" 'PUBLISHED_BLOCK_EXECUTION=NO'
            exact_line "$live_stdout" 'WINLATOR_COMPARISON=NOT_RUN'

            exact_line "$live_manifest" 'DBLYATEM_ARM64_TRANSLATION_BENCHMARK_MANIFEST_V1'
            exact_line "$live_manifest" 'FORMAT_VERSION=1'
            exact_line "$live_manifest" 'BENCHMARK=arm64-translation-reuse'
            exact_line "$live_manifest" 'RUNTIME_ID=DBLYATEM_POST_MERGE_R2'
            exact_line "$live_manifest" "RUNTIME_BUILD=$expected_main"
            exact_line "$live_manifest" 'HOST_ARCH=aarch64'
            exact_line "$live_manifest" 'CLOCK=CLOCK_MONOTONIC_RAW'
            exact_line "$live_manifest" 'CLOCK_UNIT=nanoseconds'
            exact_line "$live_manifest" 'ITERATIONS=8'
            exact_line "$live_manifest" 'SAMPLE_COUNT=32'
            exact_line "$live_manifest" 'PUBLISHED_BLOCK_EXECUTION=NO'
            exact_line "$live_manifest" 'WINLATOR_COMPARISON=NOT_RUN'

            [ "$(wc -l < "$live_csv" | tr -d ' ')" = '33' ]
            awk -F, 'NF != 32 { exit 1 }' "$live_csv"
            awk -F, 'NR > 1 && $2 != NR - 1 { exit 1 }' "$live_csv"
            awk -F, 'NR > 1 && $6 < $5 { exit 1 }' "$live_csv"
            awk -F, 'NR > 1 && $7 != $6 - $5 { exit 1 }' "$live_csv"
            awk -F, 'NR > 1 && $4 == "PUBLICATION_INSERT" { count++ } END { exit count == 8 ? 0 : 1 }' "$live_csv"
            awk -F, 'NR > 1 && $4 == "LOOKUP_HIT" { count++ } END { exit count == 8 ? 0 : 1 }' "$live_csv"
            awk -F, 'NR > 1 && $4 == "LOOKUP_MISS" { count++ } END { exit count == 8 ? 0 : 1 }' "$live_csv"
            awk -F, 'NR > 1 && $4 == "PUBLICATION_DUPLICATE" { count++ } END { exit count == 8 ? 0 : 1 }' "$live_csv"

            combined="$output/combined-logs.txt"
            find "$output/verify-all/logs" -type f -name '*.log' -print0 |
              sort -z |
              xargs -0 cat > "$combined"

            for forbidden in \
              'unused-result' \
              'undeclared identifier' \
              'AddressSanitizer:' \
              'UndefinedBehaviorSanitizer:' \
              'runtime error:' \
              'TEST: FAIL' \
              'VERIFY: FAIL'
            do
              if grep -F "$forbidden" "$combined" >/dev/null; then
                printf 'FORBIDDEN LOG MARKER: %s\n' "$forbidden" >&2
                exit 1
              fi
            done
            rm -f "$combined"

            {
              printf 'DBLYATEM_MAIN_POST_PR114_ARM64_R2_ACCEPTED\n'
              printf 'MAIN_HEAD=%s\n' "$expected_main"
              printf 'MERGED_FEATURE_HEAD=%s\n' "$expected_feature"
              printf 'CONFIG_HEAD=%s\n' "$expected_config"
              printf 'EVIDENCE_CHALLENGE=%s\n' "$expected_challenge"
              printf 'EXECUTION_PROVIDER=CIRCLECI\n'
              printf 'HOST_ARCH=AARCH64\n'
              printf 'RUNTIME_PAGE_SIZE=4096\n'
              printf 'FEATURE_ANCESTOR_OF_MAIN=PASS\n'
              printf 'FEATURE_DIRECT_PARENT_OF_MAIN=PASS\n'
              printf 'CANONICAL_VERIFY_ALL=PASS\n'
              printf 'VERIFY_STEP_21=PASS\n'
              printf 'VERIFY_STEP_22=PASS\n'
              printf 'BENCHMARK_RECORD_CONTRACT=PASS\n'
              printf 'OUTPUT_PAIR_FAIL_CLOSED=PASS\n'
              printf 'RAW_CSV_V1=PASS\n'
              printf 'CLOCK_MONOTONIC_RAW=PASS\n'
              printf 'BINARY_OUTCOME_FLAGS=PASS\n'
              printf 'WRAPAROUND_REGRESSION=PASS\n'
              printf 'LIVE_SAMPLE_COUNT=32\n'
              printf 'PUBLISHED_BLOCK_EXECUTION=NO\n'
              printf 'WINLATOR_COMPARISON=NOT_RUN\n'
              printf 'NATIVE_AARCH64_EXECUTION=PASS\n'
              printf 'MAIN_POST_PR114_ARM64_R2=PASS\n'
            } > "$output/accepted.txt"

            (
              cd "$output"
              find . -type f ! -name SHA256SUMS -print0 |
                LC_ALL=C sort -z |
                xargs -0 sha256sum > SHA256SUMS
            )

            (
              cd /tmp
              tar -czf "$archive" dblyatem-main-post-pr114-r2-output
            )

            (
              cd "$artifacts"
              sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
            )

            printf '%s\n' 'MAIN POST-PR114 ARM64 R2 CIRCLECI VERIFY: PASS'
            printf 'MAIN_HEAD=%s\n' "$expected_main"
            printf 'MERGED_FEATURE_HEAD=%s\n' "$expected_feature"
            printf 'CONFIG_HEAD=%s\n' "$expected_config"
            printf 'EVIDENCE_CHALLENGE=%s\n' "$expected_challenge"
            printf 'VERIFY_STEP_21=PASS\n'
            printf 'VERIFY_STEP_22=PASS\n'
            printf 'LIVE_SAMPLE_COUNT=32\n'
            printf 'NATIVE_AARCH64_EXECUTION=PASS\n'

      - store_artifacts:
          path: /tmp/dblyatem-main-post-pr114-r2-artifacts
          destination: dblyatem-main-post-pr114-r2-artifacts
          when: always

workflows:
  main-post-pr114-arm64-r2:
    when: << pipeline.parameters.run_main_post_pr114_arm64_r2 >>
    jobs:
      - main-post-pr114-arm64-r2
