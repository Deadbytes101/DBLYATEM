version: 2.1

jobs:
  pr98-native-arm64-linux-evidence:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    shell: /bin/bash -eo pipefail
    steps:
      - run:
          name: Install strict native toolchain
          command: |
            set -euo pipefail
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              git \
              gcc \
              clang \
              file \
              util-linux \
              coreutils \
              tar

      - run:
          name: Execute exact DBLYATEM PR98 native ARM64 evidence
          command: |
            set -euo pipefail

            expected='8886fe231eaaefd9c28ed6fe9a7dc404739cc566'
            challenge='0f9d66bc95e62d3c5fa1ae695ed9917605db48c31e24427667c9dd8d08391328'
            source='/tmp/dblyatem-pr98-feature'
            artifact_root='/tmp/dblyatem-pr98-arm64-artifacts'
            evidence="$artifact_root/pr98-native-arm64-linux-evidence"
            archive="$artifact_root/pr98-native-arm64-linux-evidence.tar.gz"
            archive_checksum="${archive}.sha256"
            host="$evidence/host.txt"
            log="$evidence/step18.log"
            accepted="$evidence/accepted.txt"

            rm -rf "$source" "$artifact_root"
            mkdir -p "$evidence"

            git init -q "$source"
            git -C "$source" remote add origin \
              https://github.com/Deadbytes101/DBLYATEM.git
            git -C "$source" fetch -q --depth=1 origin "$expected"
            git -C "$source" checkout -q --detach FETCH_HEAD

            head=$(git -C "$source" rev-parse HEAD)
            machine=$(uname -m)
            page_size=$(getconf PAGESIZE)
            dirty=$(git -C "$source" status --porcelain --untracked-files=no)
            shell_path=$(command -v sh)
            shell_file=$(file -Lb "$shell_path")
            operating_system=$(uname -o 2>/dev/null || printf '%s' unknown)
            virtualization=$(systemd-detect-virt 2>/dev/null || printf '%s' none)

            [ "$head" = "$expected" ] || {
              printf 'EXPECTED=%s\nACTUAL=%s\n' "$expected" "$head"
              exit 90
            }

            case "$machine" in
              aarch64|arm64) ;;
              *)
                printf 'NOT ARM64 LINUX: %s\n' "$machine"
                exit 91
                ;;
            esac

            [ "$page_size" = 4096 ] || {
              printf 'UNEXPECTED PAGE_SIZE=%s\n' "$page_size"
              exit 92
            }

            [ -z "$dirty" ] || {
              printf '%s\n%s\n' 'EXACT-HEAD CHECKOUT IS DIRTY' "$dirty"
              exit 93
            }

            [ ! -x /system/bin/getprop ] || {
              printf '%s\n' 'ANDROID DETECTED IN LINUX JOB'
              exit 94
            }

            [ "$operating_system" != Android ] || {
              printf '%s\n' 'ANDROID DETECTED IN LINUX JOB'
              exit 95
            }

            case "$shell_file" in
              *AArch64*|*aarch64*) ;;
              *)
                printf 'USERSPACE IS NOT AARCH64: %s\n' "$shell_file"
                exit 96
                ;;
            esac

            case "$virtualization" in
              qemu|bochs|uml)
                printf 'SOFTWARE EMULATION REJECTED: %s\n' "$virtualization"
                exit 97
                ;;
            esac

            {
              printf '%s\n' 'DBLYATEM_PR98_CIRCLECI_ARM64_LINUX_V1'
              printf 'FEATURE_HEAD=%s\n' "$head"
              printf 'EVIDENCE_CHALLENGE=%s\n' "$challenge"
              printf 'EXECUTION_PROVIDER=CIRCLECI\n'
              printf 'CIRCLE_WORKFLOW_ID=%s\n' "${CIRCLE_WORKFLOW_ID:-unknown}"
              printf 'CIRCLE_BUILD_NUM=%s\n' "${CIRCLE_BUILD_NUM:-unknown}"
              printf 'CIRCLE_BRANCH=%s\n' "${CIRCLE_BRANCH:-unknown}"
              printf 'MACHINE=%s\n' "$machine"
              printf 'RUNTIME_PAGE_SIZE=%s\n' "$page_size"
              printf 'USERSPACE_FILE=%s\n' "$shell_file"
              printf 'VIRTUALIZATION=%s\n' "$virtualization"
              printf 'UNAME=%s\n' "$(uname -a)"
              printf 'GCC_VERSION=%s\n' "$(gcc --version | sed -n '1p')"
              printf 'CLANG_VERSION=%s\n' "$(clang --version | sed -n '1p')"
              printf '%s\n' 'ANDROID=NO'
              printf '%s\n' 'FRESH_CHECKOUT_DIRTY=NO'
            } > "$host"

            lscpu > "$evidence/lscpu.txt"
            cat /proc/cpuinfo > "$evidence/cpuinfo.txt"

            set +e
            /bin/sh "$source/tools/verify-linux-arm64-wx-provider.sh" \
              > "$log" 2>&1
            status=$?
            set -e

            cat "$log"

            [ "$status" -eq 0 ] || {
              printf 'ARM64 LINUX STEP18 EXIT=%s\n' "$status"
              exit "$status"
            }

            require_count()
            {
              line=$1
              expected_count=$2
              code=$3
              actual_count=$(grep -Fxc "$line" "$log" || true)

              [ "$actual_count" -eq "$expected_count" ] || {
                printf 'LINE=%s\n' "$line"
                printf 'EXPECTED_COUNT=%s\n' "$expected_count"
                printf 'ACTUAL_COUNT=%s\n' "$actual_count"
                exit "$code"
              }
            }

            require_count 'LINUX ARM64 W^X MOCK TEST: PASS' 3 101
            require_count 'LINUX W^X PERMISSION OBSERVATION: PASS' 2 102
            require_count 'NATIVE AARCH64 EXECUTION: PASS' 1 103
            require_count 'ANDROID ARM64 RUNTIME EVIDENCE: NOT CLAIMED' 1 104
            require_count 'NO RWX TRANSITION VERIFY: PASS' 1 105
            require_count 'LINUX ANDROID ARM64 W^X PROVIDER VERIFY: PASS' 1 106

            if grep -Fx 'NATIVE AARCH64 EXECUTION: NOT CLAIMED' "$log" >/dev/null; then
              printf '%s\n' 'ARM64 RUNNER FALSELY LEFT EXECUTION UNCLAIMED'
              exit 107
            fi

            if grep -Fx 'ANDROID ARM64 RUNTIME EVIDENCE: PASS' "$log" >/dev/null; then
              printf '%s\n' 'LINUX RUNNER FALSELY CLAIMED ANDROID'
              exit 108
            fi

            {
              printf '%s\n' 'DBLYATEM_PR98_NATIVE_ARM64_LINUX_EVIDENCE_ACCEPTED'
              printf 'HEAD=%s\n' "$head"
              printf 'EVIDENCE_CHALLENGE=%s\n' "$challenge"
              printf 'EXECUTION_PROVIDER=CIRCLECI\n'
              printf 'MACHINE=%s\n' "$machine"
              printf 'HOST_ARCH=AARCH64\n'
              printf 'RUNTIME_PAGE_SIZE=%s\n' "$page_size"
              printf 'ANDROID=NO\n'
              printf 'QEMU_TCG=NO\n'
              printf 'FRESH_CHECKOUT_DIRTY=NO\n'
              printf 'LINUX_ARM64_WX_MOCK_TEST_COUNT=3\n'
              printf 'LINUX_WX_PERMISSION_OBSERVATION_COUNT=2\n'
              printf 'NATIVE_AARCH64_EXECUTION=PASS\n'
              printf 'ANDROID_ARM64_RUNTIME_EVIDENCE=NOT_CLAIMED\n'
              printf 'NO_RWX_TRANSITION_VERIFY=PASS\n'
              printf 'LINUX_ANDROID_ARM64_WX_PROVIDER_VERIFY=PASS\n'
              printf 'NATIVE_LINUX_ARM64_EVIDENCE=PASS\n'
            } > "$accepted"

            (
              cd "$evidence"
              sha256sum \
                host.txt \
                step18.log \
                lscpu.txt \
                cpuinfo.txt \
                accepted.txt \
                > SHA256SUMS
            )

            tar -C "$artifact_root" -czf "$archive" \
              pr98-native-arm64-linux-evidence
            (
              cd "$artifact_root"
              sha256sum "$(basename "$archive")" \
                > "$(basename "$archive_checksum")"
            )

            printf '\n%s\n' \
              'DBLYATEM PR98 CIRCLECI ARM64 LINUX EVIDENCE ACCEPTED'
            printf 'HEAD=%s\n' "$head"
            printf 'MACHINE=%s\n' "$machine"
            printf 'EVIDENCE=%s\n' "$evidence"

      - store_artifacts:
          path: /tmp/dblyatem-pr98-arm64-artifacts
          destination: dblyatem-pr98-arm64-artifacts

workflows:
  pr98-native-arm64-linux-evidence:
    jobs:
      - pr98-native-arm64-linux-evidence:
          filters:
            branches:
              only:
                - deadbyte/pr98-arm64-evidence
            tags:
              ignore: /.*/
