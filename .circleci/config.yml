version: 2.1

parameters:
  run_main_post_pr112_arm64_r3:
    type: boolean
    default: false

jobs:
  main-post-pr112-arm64-r3:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.medium
    shell: /bin/bash -eo pipefail

    steps:
      - run:
          name: Install strict native toolchain
          command: |
            set -euo pipefail

            sudo env \
              DEBIAN_FRONTEND=noninteractive \
              NEEDRESTART_MODE=a \
              apt-get update

            sudo env \
              DEBIAN_FRONTEND=noninteractive \
              NEEDRESTART_MODE=a \
              apt-get install -y --no-install-recommends \
                git \
                gcc \
                clang \
                make \
                file \
                util-linux \
                coreutils \
                grep \
                sed \
                findutils \
                tar

      - run:
          name: Verify exact merged main after PR112 on native ARM64
          command: |
            set -euo pipefail

            repository='https://github.com/Deadbytes101/DBLYATEM.git'
            expected_main='ce198297c2a40e4e29e69889ac895b150f457527'
            expected_feature='f9a77b911eb113bca055f65548ba0a8972d1a17f'
            expected_config="${CIRCLE_SHA1}"
            expected_challenge='50554f4f64ee59e673504cd8d9f3b90dbd9e98f2f39b8aec2d8e6dba95d9406f'

            checkout='/tmp/dblyatem-main-post-pr112-r3-checkout'
            output='/tmp/dblyatem-main-post-pr112-r3-output'
            artifact_root='/tmp/dblyatem-main-post-pr112-r3-artifacts'
            archive="$artifact_root/main-post-pr112-arm64-r3.tar.gz"
            outer_sum="$archive.sha256"

            rm -rf "$checkout" "$output" "$artifact_root"
            mkdir -p "$checkout" "$output" "$artifact_root"

            machine=$(uname -m)
            case "$machine" in
              aarch64|arm64) ;;
              *)
                printf 'HOST ARCH REJECTED: %s\n' "$machine" >&2
                exit 1
                ;;
            esac

            page_size=$(getconf PAGESIZE)
            [ "$page_size" = '4096' ] || {
              printf 'PAGE SIZE REJECTED: %s\n' "$page_size" >&2
              exit 1
            }

            shell_identity=$(file -L /bin/sh)
            printf '%s\n' "$shell_identity" |
              grep -Eiq 'aarch64|ARM aarch64' || {
                printf 'NON-AARCH64 USERSPACE REJECTED: %s\n' "$shell_identity" >&2
                exit 1
              }

            virtualization=$(systemd-detect-virt 2>/dev/null || true)
            case "$virtualization" in
              qemu|bochs|uml)
                printf 'EMULATED HOST REJECTED: %s\n' "$virtualization" >&2
                exit 1
                ;;
            esac

            git init "$checkout"
            git -C "$checkout" remote add origin "$repository"
            git -C "$checkout" fetch --depth=2 origin "$expected_main"
            git -C "$checkout" checkout --detach FETCH_HEAD

            observed_main=$(git -C "$checkout" rev-parse HEAD)
            [ "$observed_main" = "$expected_main" ] || {
              printf 'MAIN HEAD MISMATCH expected=%s actual=%s\n' \
                "$expected_main" "$observed_main" >&2
              exit 1
            }

            git -C "$checkout" cat-file -e "$expected_feature^{commit}"
            git -C "$checkout" merge-base --is-ancestor \
              "$expected_feature" "$expected_main"

            parent_count=$(
              git -C "$checkout" cat-file -p "$expected_main" |
                grep -Fxc "parent $expected_feature" || true
            )
            [ "$parent_count" -eq 1 ] || {
              printf 'MERGED FEATURE PARENT MISMATCH count=%s\n' \
                "$parent_count" >&2
              exit 1
            }

            tracked_dirty=$(git -C "$checkout" status --porcelain --untracked-files=no)
            [ -z "$tracked_dirty" ] || {
              printf '%s\n' 'FRESH CHECKOUT TRACKED DIRTY' >&2
              exit 1
            }

            common="$checkout/src/arm64_translation_reuse_common.c"
            validation="$checkout/tests/arm64_translation_reuse_validation_test.c"

            grep -Fq 'maximum_probes,' "$common"
            grep -Fq 'operation_count - UINT64_C(1),' "$common"
            grep -Fq 'operation_count > UINT64_MAX / maximum_probes' "$common"
            grep -Fq 'maximum_total = operation_count * maximum_probes;' "$common"
            grep -Fq 'test_impossible_probe_metrics' "$validation"

            {
              printf 'IMPOSSIBLE_PROBE_AGGREGATE_LOWER_BOUND=BOUND\n'
              printf 'IMPOSSIBLE_PROBE_AGGREGATE_UPPER_BOUND=BOUND\n'
              printf 'IMPOSSIBLE_PROBE_AGGREGATE_REGRESSION=PRESENT\n'
            } > "$output/source-contract.txt"

            set +e
            (
              cd "$checkout"
              /bin/sh tools/verify-all.sh
            ) > "$output/verify-all.stdout.log" 2>&1
            verify_status=$?
            set -e

            if [ -d "$checkout/build/verify-all" ]; then
              cp -R "$checkout/build/verify-all" "$output/verify-all"
            fi

            {
              printf 'DBLYATEM_MAIN_POST_PR112_ARM64_R3_HOST\n'
              printf 'MAIN_HEAD=%s\n' "$observed_main"
              printf 'MERGED_FEATURE_HEAD=%s\n' "$expected_feature"
              printf 'CONFIG_HEAD=%s\n' "$expected_config"
              printf 'EVIDENCE_CHALLENGE=%s\n' "$expected_challenge"
              printf 'MACHINE=%s\n' "$machine"
              printf 'RUNTIME_PAGE_SIZE=%s\n' "$page_size"
              printf 'VIRTUALIZATION=%s\n' "${virtualization:-none}"
              printf 'FRESH_CHECKOUT_DIRTY=NO\n'
              printf 'FEATURE_ANCESTOR_OF_MAIN=YES\n'
              printf 'FEATURE_DIRECT_PARENT_OF_MAIN=YES\n'
            } > "$output/host.txt"

            [ "$verify_status" -eq 0 ] || {
              cp "$output/verify-all.stdout.log" \
                "$artifact_root/verify-all.failed.log"
              if [ -d "$output/verify-all" ]; then
                cp -R "$output/verify-all" \
                  "$artifact_root/verify-all-failed"
              fi
              printf 'VERIFY_ALL_EXIT=%s\n' "$verify_status" >&2
              exit "$verify_status"
            }

            manifest="$output/verify-all/manifest.txt"
            step18="$output/verify-all/logs/18_verify-linux-arm64-wx-provider.log"
            step19="$output/verify-all/logs/19_verify-arm64-block-cache.log"
            step20="$output/verify-all/logs/20_verify-arm64-translation-reuse.log"

            for required in \
              "$manifest" \
              "$step18" \
              "$step19" \
              "$step20"
            do
              [ -f "$required" ] || {
                printf 'REQUIRED EVIDENCE FILE MISSING: %s\n' "$required" >&2
                exit 1
              }
            done

            exact_line()
            {
              file_path=$1
              expected=$2
              actual=$(grep -Fxc "$expected" "$file_path" || true)
              [ "$actual" -eq 1 ] || {
                printf 'EXACT LINE MISMATCH file=%s line=[%s] expected=1 actual=%s\n' \
                  "$file_path" "$expected" "$actual" >&2
                exit 1
              }
            }

            exact_count()
            {
              file_path=$1
              expected=$2
              count=$3
              actual=$(grep -Fxc "$expected" "$file_path" || true)
              [ "$actual" -eq "$count" ] || {
                printf 'EXACT COUNT MISMATCH file=%s line=[%s] expected=%s actual=%s\n' \
                  "$file_path" "$expected" "$count" "$actual" >&2
                exit 1
              }
            }

            exact_line "$manifest" "COMMIT_SHA=$expected_main"
            exact_line "$manifest" 'STEP_18_NAME=verify-linux-arm64-wx-provider'
            exact_line "$manifest" 'STEP_18_EXIT=0'
            exact_line "$manifest" 'STEP_19_NAME=verify-arm64-block-cache'
            exact_line "$manifest" 'STEP_19_EXIT=0'
            exact_line "$manifest" 'STEP_20_NAME=verify-arm64-translation-reuse'
            exact_line "$manifest" 'STEP_20_EXIT=0'
            exact_line "$manifest" 'FAILED_STEP=NONE'
            exact_line "$manifest" 'OVERALL_STATUS=PASS'

            exact_line "$output/verify-all.stdout.log" 'VERIFY ALL: PASS'
            exact_line "$step18" 'NATIVE AARCH64 EXECUTION: PASS'
            exact_line "$step19" 'ARM64 BLOCK CACHE VERIFY: PASS'

            exact_count "$step20" 'ARM64 TRANSLATION REUSE TEST: PASS' 3
            exact_count "$step20" 'ARM64 TRANSLATION REUSE OUTCOME TEST: PASS' 3
            exact_count "$step20" 'ARM64 TRANSLATION REUSE REPLAY TEST: PASS' 3
            exact_count "$step20" 'ARM64 TRANSLATION REUSE VALIDATION TEST: PASS' 3
            exact_count "$step20" 'ARM64 TRANSLATION REUSE LOOKUP ALIAS TEST: PASS' 3
            exact_count "$step20" 'ARM64 TRANSLATION REUSE PUBLISH ALIAS TEST: PASS' 3
            exact_line "$step20" 'ARM64 TRANSLATION REUSE VERIFY: PASS'
            exact_line "$step20" 'ARM64 TRANSLATION REUSE WORKLOAD METRICS: PASS'
            exact_line "$step20" 'ARM64 TRANSLATION REUSE DETERMINISTIC REPLAY: PASS'
            exact_line "$step20" 'ARM64 TRANSLATION REUSE TRANSACTIONAL BOUNDARY: PASS'
            exact_line "$step20" 'ARM64 TRANSLATION REUSE NONEXECUTING BOUNDARY: PASS'

            combined="$output/combined-logs.txt"
            find "$output/verify-all/logs" -type f -name '*.log' -print0 |
              sort -z |
              xargs -0 cat > "$combined"

            for forbidden in \
              'unused-result' \
              'undeclared identifier' \
              'AddressSanitizer:' \
              'UndefinedBehaviorSanitizer:' \
              'runtime error:' \
              'TEST: FAIL' \
              'VERIFY: FAIL'
            do
              if grep -F "$forbidden" "$combined" >/dev/null; then
                printf 'FORBIDDEN LOG MARKER: %s\n' "$forbidden" >&2
                exit 1
              fi
            done

            rm -f "$combined"

            {
              printf 'DBLYATEM_MAIN_POST_PR112_ARM64_R3_ACCEPTED\n'
              printf 'MAIN_HEAD=%s\n' "$expected_main"
              printf 'MERGED_FEATURE_HEAD=%s\n' "$expected_feature"
              printf 'CONFIG_HEAD=%s\n' "$expected_config"
              printf 'EVIDENCE_CHALLENGE=%s\n' "$expected_challenge"
              printf 'EXECUTION_PROVIDER=CIRCLECI\n'
              printf 'HOST_ARCH=AARCH64\n'
              printf 'RUNTIME_PAGE_SIZE=4096\n'
              printf 'FEATURE_ANCESTOR_OF_MAIN=PASS\n'
              printf 'FEATURE_DIRECT_PARENT_OF_MAIN=PASS\n'
              printf 'CANONICAL_VERIFY_ALL=PASS\n'
              printf 'VERIFY_STEP_20=PASS\n'
              printf 'WORKLOAD_METRICS=PASS\n'
              printf 'DETERMINISTIC_REPLAY=PASS\n'
              printf 'IMPOSSIBLE_PROBE_AGGREGATE_VALIDATION=PASS\n'
              printf 'TRANSACTIONAL_BOUNDARY=PASS\n'
              printf 'NONEXECUTING_BOUNDARY=PASS\n'
              printf 'NATIVE_AARCH64_EXECUTION=PASS\n'
              printf 'MAIN_POST_PR112_ARM64_R3=PASS\n'
            } > "$output/accepted.txt"

            (
              cd "$output"
              find . -type f ! -name SHA256SUMS -print0 |
                LC_ALL=C sort -z |
                xargs -0 sha256sum > SHA256SUMS
            )

            (
              cd /tmp
              tar -czf "$archive" dblyatem-main-post-pr112-r3-output
            )
            (
              cd "$artifact_root"
              sha256sum "$(basename "$archive")" > "$(basename "$outer_sum")"
            )

            printf '%s\n' 'MAIN POST-PR112 ARM64 R3 CIRCLECI VERIFY: PASS'
            printf 'MAIN_HEAD=%s\n' "$expected_main"
            printf 'MERGED_FEATURE_HEAD=%s\n' "$expected_feature"
            printf 'CONFIG_HEAD=%s\n' "$expected_config"
            printf 'EVIDENCE_CHALLENGE=%s\n' "$expected_challenge"
            printf 'NATIVE_AARCH64_EXECUTION=PASS\n'
            printf 'VERIFY_STEP_20=PASS\n'

      - store_artifacts:
          path: /tmp/dblyatem-main-post-pr112-r3-artifacts
          destination: dblyatem-main-post-pr112-r3-artifacts
          when: always

workflows:
  main-post-pr112-arm64-r3:
    when: << pipeline.parameters.run_main_post_pr112_arm64_r3 >>
    jobs:
      - main-post-pr112-arm64-r3
