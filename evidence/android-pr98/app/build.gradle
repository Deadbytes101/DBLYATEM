plugins {
    id 'com.android.application'
}

def featureDir = providers.gradleProperty('dblyatemFeatureDir').orNull
if (featureDir == null || featureDir.trim().isEmpty()) {
    throw new GradleException(
        'Missing -PdblyatemFeatureDir=<exact PR98 checkout>'
    )
}

android {
    namespace = 'com.deadbyte.dblyatem.pr98evidence'
    compileSdk = 36
    ndkVersion = '28.2.13676358'

    defaultConfig {
        applicationId = 'com.deadbyte.dblyatem.pr98evidence'
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
        testInstrumentationRunner =
            'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters.add('arm64-v8a')
        }

        externalNativeBuild {
            cmake {
                arguments.add(
                    "-DDBLYATEM_FEATURE_DIR=${featureDir}"
                )
            }
        }
    }

    buildTypes {
        debug {
            debuggable = true
            minifyEnabled = false
        }
        release {
            minifyEnabled = false
        }
    }

    externalNativeBuild {
        cmake {
            path = file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }

    testOptions {
        animationsDisabled = true
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
