#cloud-config

package_update: true
package_upgrade: false

packages:
  - git
  - gcc
  - clang
  - file
  - util-linux
  - coreutils
  - tar

write_files:
  - path: /usr/local/sbin/run-dblyatem-pr98-native-arm64-evidence
    owner: root:root
    permissions: '0755'
    content: |
      #!/bin/sh
      set -eu

      repository='https://github.com/Deadbytes101/DBLYATEM.git'
      portable_kit_head='b1688958f1993a5c885beb912f39fe7be5f64133'
      feature_head='8886fe231eaaefd9c28ed6fe9a7dc404739cc566'
      challenge='0f9d66bc95e62d3c5fa1ae695ed9917605db48c31e24427667c9dd8d08391328'

      checkout='/opt/dblyatem-pr98-arm64-evidence'
      output='/var/tmp/pr98-native-arm64-linux-evidence'
      archive="${output}.tar.gz"
      archive_checksum="${archive}.sha256"
      status='/var/tmp/DBLYATEM-PR98-NATIVE-ARM64-STATUS.txt'

      rm -rf "$checkout"
      rm -rf "$output"
      rm -f "$archive" "$archive_checksum" "$status"

      git init -q "$checkout"
      git -C "$checkout" remote add origin "$repository"
      git -C "$checkout" fetch -q --depth=1 origin "$portable_kit_head"
      git -C "$checkout" checkout -q --detach FETCH_HEAD

      actual_kit_head=$(git -C "$checkout" rev-parse HEAD)
      [ "$actual_kit_head" = "$portable_kit_head" ]

      evidence_dir="$checkout/evidence/pr98-native-arm64-linux"
      cd "$evidence_dir"

      export DBLYATEM_EVIDENCE_CHALLENGE="$challenge"

      /bin/sh ./run-native-arm64-linux-evidence.sh "$output"
      /bin/sh ./verify-evidence-package.sh "$output"
      /bin/sh ./verify-evidence-package.sh "$archive"

      chmod -R a+rX "$output"
      chmod a+r "$archive" "$archive_checksum"

      {
          printf '%s\n' 'DBLYATEM_PR98_NATIVE_ARM64_CLOUD_INIT_V1'
          printf 'PORTABLE_KIT_HEAD=%s\n' "$portable_kit_head"
          printf 'FEATURE_HEAD=%s\n' "$feature_head"
          printf 'EVIDENCE_CHALLENGE=%s\n' "$challenge"
          printf '%s\n' 'DIRECTORY_VERIFY=PASS'
          printf '%s\n' 'ARCHIVE_VERIFY=PASS'
          printf '%s\n' 'RESULT=PASS'
          printf 'EVIDENCE=%s\n' "$output"
          printf 'ARCHIVE=%s\n' "$archive"
          printf 'ARCHIVE_SHA256=%s\n' "$archive_checksum"
      } > "$status"

      chmod a+r "$status"
      cat "$status"

runcmd:
  - /usr/local/sbin/run-dblyatem-pr98-native-arm64-evidence

final_message: 'DBLYATEM PR98 native ARM64 cloud-init finished; inspect /var/tmp/DBLYATEM-PR98-NATIVE-ARM64-STATUS.txt'
